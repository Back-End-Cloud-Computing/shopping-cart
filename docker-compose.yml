services:
  redis:
    image: redis:7-alpine
    container_name: shopping-cart-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  cart-service:
    build: .
    container_name: shopping-cart-service
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - ganjj-net

volumes:
  redis-data:

networks:
  default:
  ganjj-net:
    external: true
